<aside class="w-64 flex-shrink-0 bg-white border-r border-gray-200 hidden md:flex flex-col h-screen sticky top-0 z-40 shadow-sm transition-all duration-300">
  <div class="h-16 flex items-center px-6 border-b border-gray-200">
    <div class="flex items-center gap-3">
        {% include 'partials/talvo_mark.html' %}
        <span class="text-xl font-bold tracking-tight text-gray-900">Talvo<span class="text-indigo-600">AI</span></span>
    </div>
  </div>
  
  <div class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
    <!-- Dashboard -->
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
      </svg>
      Dashboard
    </a>
    
    <!-- Interview Setup -->
    <a href="{% url 'interview_setup' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
      </svg>
      Interview Setup
    </a>
    
    <!-- Performance and History -->
    <a href="{% url 'history_page' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3v18M4 13h4m-4-4h7m2-3h7m-7 8h7m-7 4h7"></path>
      </svg>
      Performance and History
    </a>
    
    <!-- Preferences / Settings -->
    <a href="{% url 'settings_page' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
      Preferences
    </a>
  </div>
  
  <div class="p-4 border-t border-gray-200">
    <a href="{% url 'profile_page' %}" class="flex items-center gap-3 px-3 py-2 rounded-xl transition-colors hover:bg-gray-50">
        <div class="h-8 w-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 font-semibold border border-gray-200 flex-shrink-0">
          U
      </div>
      <div class="flex flex-col overflow-hidden">
        <span class="text-sm font-medium text-gray-900 truncate">{{ request.user.get_full_name|default:request.user.email|default:'User Account' }}</span>
        <span class="text-xs text-gray-500 truncate">{{ request.user.email|default:'Signed in user' }}</span>
      </div>
    </a>
    <form method="post" action="{% url 'logout_user' %}" class="mt-2 px-3">
      {% csrf_token %}
      <button type="submit" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 text-xs font-semibold text-gray-700 transition-colors hover:bg-gray-100">Sign out</button>
    </form>
  </div>
</aside>
