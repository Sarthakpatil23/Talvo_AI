<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Talvo Live Interview</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>body{font-family:'Plus Jakarta Sans',sans-serif;} .pulse{animation:pulse 1.4s ease-in-out infinite;} @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div class="flex-1 min-w-0 flex flex-col min-h-screen">
    <main class="max-w-6xl mx-auto w-full px-6 py-8 space-y-8">
      <header class="flex items-center justify-between">
        <button onclick="window.location.href='{% url 'dashboard' %}'" class="rounded-xl border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200">Exit Interview</button>
        <div class="rounded-full border border-indigo-200 bg-indigo-50 px-4 py-1.5 text-xs font-semibold tracking-[0.14em] text-indigo-700">LIVE 04:12</div>
      </header>

      <section class="grid gap-6 lg:grid-cols-2">
        <article class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
          <p class="text-sm text-gray-500 uppercase tracking-wide">Current Prompt</p>
          <h1 class="mt-2 text-3xl font-semibold tracking-tight">Tell me about a time you had to handle a difficult stakeholder.</h1>
          <div class="mt-8 flex items-center gap-4 rounded-xl border border-gray-200 bg-gray-50 p-4">
            <div class="h-12 w-12 rounded-full bg-indigo-600"></div>
            <div>
              <p class="font-semibold">Talvo Interviewer</p>
              <p class="text-sm text-gray-600">Listening...</p>
            </div>
          </div>
        </article>

        <article class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
          <h2 class="text-2xl font-semibold tracking-tight">Your Live Signal</h2>
          <div class="mt-6 flex h-28 items-end justify-center gap-2">
            <span class="pulse h-8 w-2 rounded-full bg-indigo-500"></span><span class="pulse h-14 w-2 rounded-full bg-indigo-500" style="animation-delay:.1s"></span><span class="pulse h-20 w-2 rounded-full bg-indigo-500" style="animation-delay:.2s"></span><span class="pulse h-24 w-2 rounded-full bg-indigo-500" style="animation-delay:.3s"></span><span class="pulse h-16 w-2 rounded-full bg-indigo-500" style="animation-delay:.4s"></span>
          </div>
          <div class="mt-6 rounded-xl border border-gray-200 bg-gray-50 p-3 text-sm text-gray-700">Tip: lead with outcome, then explain your influence strategy.</div>
          <button class="mt-5 w-full rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 py-3 text-sm font-semibold text-white shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200" onclick="window.location.href='{% url 'feedback_dashboard' %}'">End and Analyze</button>
        </article>
      </section>
    </main>

    {% include 'partials/global_ui_enhancements.html' %}
  </div>
</body>
</html>
